# Written in-house by QA for M1 criterion 19 (docs/milestones/m1.md). Tenant content: data only,
# never executed. HTML, script, event handlers and javascript: URLs in descriptions, summaries,
# examples, enum values and names; in descriptions also a javascript: link and a remote image.
# Each description holds one construct, so its safe form (ADR 0003, "Tenant Markdown") can be
# written by hand. Expected values: fixtures/specs/expected/hostile-content.json.
# No host named here is contacted by any test: tracker.example is reserved (RFC 2606).
openapi: 3.0.3
info:
  title: Hostile Content
  version: 1.0.0
  description: 'Hello <script>alert(1)</script> world'
externalDocs:
  url: 'javascript:alert(1)'
  description: '[Click here](javascript:alert(document.cookie)) to continue.'
servers:
  - url: https://api.example.com
security:
  - apiKey: []
tags:
  - name: '<script>alert(''tag'')</script>'
    description: '<img src="https://tracker.example/x.png" onerror="alert(1)">'
paths:
  /things:
    get:
      operationId: '<img src=x onerror=alert(1)>'
      tags: ['<script>alert(''tag'')</script>']
      summary: '<b onmouseover="alert(1)">Get</b> things'
      description: '[Click here](javascript:alert(document.cookie)) to continue.'
      parameters:
        - name: '<q onfocus=alert(1)>'
          in: query
          required: true
          description: '![Remote image](https://tracker.example/pixel.gif)'
          schema:
            type: string
          example: '"><script>alert(1)</script>'
        - name: mode
          in: query
          required: true
          description: '[x](data:text/html;base64,PHNjcmlwdD5hbGVydCgxKTwvc2NyaXB0Pg==)'
          schema:
            type: string
            enum:
              - '<b>bold</b>'
              - 'javascript:alert(1)'
              - '" onmouseover="alert(1)'
              - '<img src=https://tracker.example/e.png>'
      responses:
        '200':
          description: |-
            [docs][evil]

            [evil]: javascript:alert(1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
    post:
      operationId: createThing
      tags: ['<script>alert(''tag'')</script>']
      summary: Create a thing
      description: '[Docs](https://docs.example.com/guide)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Thing'
            example:
              'onclick="alert(1)"': '<script>alert(''example'')</script>'
              link: 'javascript:alert(1)'
              template: 'https://attacker.example/?k={{api_key}}'
      responses:
        '201':
          description: Created.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: '<!-- comment --><style>body{display:none}</style>'
  schemas:
    Thing:
      type: object
      description: '<a href="javascript:alert(1)" onclick="steal()">open</a>'
      properties:
        'onclick="alert(1)"':
          type: string
          description: 'See <javascript:alert(1)> now'
          example: '<script>alert(''example'')</script>'
        link:
          type: string
        template:
          type: string
    # A hostile schema name. Not the target of any $ref: whether the resolver percent-decodes a
    # $ref fragment is not yet decided (question QA-6), so no reference depends on it.
    'Evil<svg onload=alert(1)>':
      type: object
      description: 'Hello <script>alert(1)</script> world'
      properties:
        id:
          type: string
